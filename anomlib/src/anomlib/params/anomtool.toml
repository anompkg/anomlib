# Each Command has 

[hash]

[hash.hash]
    ## [ParamParser]
    class = "option"
    # List of all short flags inside a string
    shorts = "H"
    keys = ["hasher"]

    ## [Add_Option]
    help = "Hasher in %(prog)s program"
    default = "md5"
    # Note basically all except shorts, class & keys are kwargs

[hash.source]
    class = "flag"
    shorts = "s"


[pull]

[pull.days]
    # Param Parser 
    class = "option"
    # List of all short flags inside a string
    shorts = "D"

    # Kwargs
    help = "Days before refresh"
    default = -7
    type = "int"

[pull.hours]
    class = "option"

    # List of all short flags inside a string
    shorts = "H"

    help = "Hours before refresh"
    default = +5
    type = "int"

[pull.source]
    type = "flag"
    shorts = "s"


[do]

[do.color]
    class = "option"
    # List of all short flags inside a string
    shorts = "c"

    help = "Set prompt's color"
    default = "Yellow"

[do.prompt]
    class = "option"
    # List of all short flags inside a string
    shorts = "p"

    help = "Set prompt"
    default = "with "

[do.readline]
    class = "option"
    # List of all short flags inside a string
    shorts = "ri"
    keys = ["inputline"]

    help = "Set readline tool"
    default = "rlwrap"

[do.history]
    class = "option"
    # List of all short flags inside a string
    shorts = "Hg"
    keys = ["group"]

    help = "History file for %(prog)s program"
    default = ""


[picload]

[picload.type]
    class = "option"
    # List of all short flags inside a string
    shorts = "t"
    keys = ["filetype"]

    help = "Set picture's filetype"
    default = "jpeg"

[picload.home]
    class = "option"
    # List of all short flags inside a string
    shorts = "d"
    keys = ["directory"]

    help = "Change Working Directory"
    default = "~/Pictures/gg"

[picload.ending]
    class = "option"
    # List of all short flags inside a string
    shorts = "e"
    keys = ["urlend"]

    help = "Set Url's ending"
    default = ".jpg"

[picload.start]
    class = "option"
    # List of all short flags inside a string
    shorts = "s"
    keys = ["start"]

    help = "Set First Comic"
    default = 1
    type = 'int'

[picload.stop]
    class = "option"
    # List of all short flags inside a string
    shorts = "S"
    keys = ["stop"]

    help = "Set Last Comic"
    default = 1
    type = 'int'


[master]

[master.output]
    class = "option"
    # List of all short flags inside a string
    shorts = "o"

    help = "Write Output into a file"

[master.foo]
    class = "option"
    help = "foo of the %(prog)s program"

[master.verbose]
    class = "flag"
    # List of all short flags inside a string
    shorts = "v"

    help = "Verbose output."

[master.act]
    class = "option"
    shorts = "a"
    help = "Test count"


[repl]
# will be like '4g with' but for interactively working with '4g'.


[help]


[install]
