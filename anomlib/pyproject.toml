[project]
name = "anomlib"
version = "0.1.2"
authors = [{ name = "🦌 Anom 🦌", email = "tfed@tutamail.com" }]
description = "A small package with anom's libraries"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "twine>=6.2.0",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
license = "GPL-3.0-or-later"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/pypa/sampleproject"
Issues = "https://github.com/pypa/sampleproject/issues"

[dependency-groups]
dev = []
fun = []

[project.scripts]
anomtool = "anomlib.commands.anomtool:main"
